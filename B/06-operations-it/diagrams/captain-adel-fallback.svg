<svg viewBox="0 0 860 960" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="860" height="960" fill="#F7F8FA"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="860" height="56" fill="#1A2235"/>
  <text x="430" y="20" text-anchor="middle" font-size="11" fill="#8FA8C8" font-weight="600" letter-spacing="2">FLY GACA — CAPTAIN ADEL RAG PIPELINE (SS 4.2 / captadel-plan.md)</text>
  <text x="430" y="44" text-anchor="middle" font-size="17" fill="#FFFFFF" font-weight="700">Captain Adel: RAG Answer Pipeline with Strict Fallback</text>
  <!-- Arrow markers -->
  <defs>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#1E6B9E"/></marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2E7D52"/></marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#D64045"/></marker>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#B8800A"/></marker>
    <marker id="mg2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#4A6FA5"/></marker>
  </defs>

  <!-- Step 1: User question -->
  <rect x="270" y="70" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#1E6B9E" stroke-width="1.5"/>
  <rect x="270" y="70" width="320" height="8" rx="8" fill="#1E6B9E"/>
  <text x="430" y="100" text-anchor="middle" font-size="13" fill="#1A2235" font-weight="700">User Question</text>
  <text x="430" y="118" text-anchor="middle" font-size="10" fill="#444C58">Regulatory or aeronautical query submitted</text>
  <text x="430" y="134" text-anchor="middle" font-size="9" fill="#8FA8C8">chat.html -> /api/chat -> Cloud Function</text>

  <line x1="430" y1="142" x2="430" y2="172" stroke="#1E6B9E" stroke-width="2" marker-end="url(#mb)"/>

  <!-- Step 2: Scope check -->
  <rect x="270" y="172" width="320" height="80" rx="8" fill="#FFFFFF" stroke="#1E6B9E" stroke-width="1.5"/>
  <rect x="270" y="172" width="320" height="8" rx="8" fill="#1E6B9E"/>
  <text x="430" y="202" text-anchor="middle" font-size="12" fill="#1A2235" font-weight="700">Scope + Safety Pre-check</text>
  <text x="430" y="218" text-anchor="middle" font-size="10" fill="#444C58">Is this a GACAR / aviation question?</text>
  <text x="430" y="234" text-anchor="middle" font-size="10" fill="#444C58">Injection / role-confusion detection</text>
  <text x="430" y="248" text-anchor="middle" font-size="8" fill="#8FA8C8">system-prompt.js pre-filter | adversarial eval cases</text>

  <!-- Out-of-scope branch LEFT -->
  <line x1="270" y1="212" x2="200" y2="212" stroke="#B8800A" stroke-width="1.5" marker-end="url(#ma)"/>
  <text x="234" y="204" text-anchor="middle" font-size="8" fill="#B8800A">Out of scope</text>
  <rect x="60" y="188" width="138" height="56" rx="6" fill="#FFF8E8" stroke="#E8920A" stroke-width="1.5"/>
  <text x="129" y="209" text-anchor="middle" font-size="9" fill="#8A5000" font-weight="700">REFUSE (scope)</text>
  <text x="129" y="225" text-anchor="middle" font-size="9" fill="#B8800A">Not a GACAR topic.</text>
  <text x="129" y="239" text-anchor="middle" font-size="9" fill="#B8800A">Redirect to library.</text>

  <line x1="430" y1="252" x2="430" y2="282" stroke="#1E6B9E" stroke-width="2" marker-end="url(#mb)"/>

  <!-- Step 3: BM25 retrieval -->
  <rect x="270" y="282" width="320" height="90" rx="8" fill="#FFFFFF" stroke="#1E6B9E" stroke-width="1.5"/>
  <rect x="270" y="282" width="320" height="8" rx="8" fill="#1E6B9E"/>
  <text x="430" y="312" text-anchor="middle" font-size="12" fill="#1A2235" font-weight="700">BM25 Retrieval (+ Hybrid RRF)</text>
  <text x="430" y="328" text-anchor="middle" font-size="10" fill="#444C58">BM25 lexical search over 47,361 GACAR chunks</text>
  <text x="430" y="344" text-anchor="middle" font-size="10" fill="#444C58">Hybrid: embedding recall fused via RRF (v0.5)</text>
  <text x="430" y="360" text-anchor="middle" font-size="10" fill="#444C58">Parent-child chunk expansion for tables/limits</text>
  <text x="430" y="372" text-anchor="middle" font-size="8" fill="#8FA8C8">functions/rag/bm25.js | _chunks.json.gz (15 MB)</text>

  <line x1="430" y1="372" x2="430" y2="402" stroke="#1E6B9E" stroke-width="2" marker-end="url(#mb)"/>

  <!-- Decision: retrieval confidence -->
  <polygon points="430,402 490,448 430,494 370,448" fill="#FFFFFF" stroke="#1E6B9E" stroke-width="1.5"/>
  <text x="430" y="442" text-anchor="middle" font-size="9" fill="#1A2235" font-weight="700">Retrieval</text>
  <text x="430" y="458" text-anchor="middle" font-size="9" fill="#1A2235" font-weight="700">confidence</text>
  <text x="430" y="471" text-anchor="middle" font-size="9" fill="#555F6D">HIGH / LOW?</text>

  <!-- LOW confidence - RIGHT branch to fallback -->
  <line x1="490" y1="448" x2="560" y2="448" stroke="#D64045" stroke-width="2" marker-end="url(#mr)"/>
  <text x="524" y="440" text-anchor="middle" font-size="8" fill="#D64045" font-weight="700">LOW</text>

  <!-- FALLBACK BOX (red, critical) -->
  <rect x="560" y="390" width="238" height="170" rx="8" fill="#FFF0F0" stroke="#D64045" stroke-width="2"/>
  <rect x="560" y="390" width="238" height="10" rx="8" fill="#D64045"/>
  <text x="679" y="417" text-anchor="middle" font-size="11" fill="#D64045" font-weight="700">STRICT FALLBACK (SS 4.2)</text>
  <text x="679" y="435" text-anchor="middle" font-size="10" fill="#8A0000" font-weight="600">REFUSE to answer operationally</text>
  <rect x="572" y="443" width="214" height="90" rx="5" fill="#FFFFFF" stroke="#D64045" stroke-width="1"/>
  <text x="679" y="462" text-anchor="middle" font-size="9" fill="#444C58" font-weight="600">Response template:</text>
  <text x="679" y="478" text-anchor="middle" font-size="9" fill="#8A0000">"I can't verify this against GACAR</text>
  <text x="679" y="492" text-anchor="middle" font-size="9" fill="#8A0000">with sufficient confidence. For</text>
  <text x="679" y="506" text-anchor="middle" font-size="9" fill="#8A0000">authoritative guidance, refer to:</text>
  <text x="679" y="520" text-anchor="middle" font-size="9" fill="#1E6B9E">[exact GACAR Part link]"</text>
  <text x="679" y="548" text-anchor="middle" font-size="8" fill="#8FA8C8">Never guess | Never paraphrase operationally</text>
  <text x="679" y="562" text-anchor="middle" font-size="8" fill="#8FA8C8">Conservative refusal is a feature, not failure</text>

  <!-- HIGH confidence - DOWN -->
  <line x1="430" y1="494" x2="430" y2="524" stroke="#2E7D52" stroke-width="2" marker-end="url(#mg)"/>
  <text x="442" y="513" font-size="8" fill="#2E7D52" font-weight="700">HIGH</text>

  <!-- Step 4: Gemini generation -->
  <rect x="270" y="524" width="320" height="90" rx="8" fill="#FFFFFF" stroke="#1E6B9E" stroke-width="1.5"/>
  <rect x="270" y="524" width="320" height="8" rx="8" fill="#1E6B9E"/>
  <text x="430" y="554" text-anchor="middle" font-size="12" fill="#1A2235" font-weight="700">Gemini Answer Generation</text>
  <text x="430" y="570" text-anchor="middle" font-size="10" fill="#444C58">gemini-2.5-flash under Captain Adel system prompt</text>
  <text x="430" y="586" text-anchor="middle" font-size="10" fill="#444C58">Constrained to retrieved passage text only</text>
  <text x="430" y="602" text-anchor="middle" font-size="10" fill="#444C58">Must cite exact Part + section + amendment</text>
  <text x="430" y="612" text-anchor="middle" font-size="8" fill="#8FA8C8">functions/rag/agent.js | SSE streaming (v0.6)</text>

  <line x1="430" y1="614" x2="430" y2="644" stroke="#1E6B9E" stroke-width="2" marker-end="url(#mb)"/>

  <!-- Step 5: Citation faithfulness guard -->
  <polygon points="430,644 494,688 430,732 366,688" fill="#FFFFFF" stroke="#E8920A" stroke-width="1.5"/>
  <text x="430" y="681" text-anchor="middle" font-size="9" fill="#1A2235" font-weight="700">Citation</text>
  <text x="430" y="696" text-anchor="middle" font-size="9" fill="#1A2235" font-weight="700">faithful?</text>
  <text x="430" y="710" text-anchor="middle" font-size="8" fill="#8FA8C8">score &gt;= 0.8?</text>

  <!-- Unfaithful branch - LEFT -->
  <line x1="366" y1="688" x2="300" y2="688" stroke="#D64045" stroke-width="1.5" marker-end="url(#mr)"/>
  <text x="332" y="680" text-anchor="middle" font-size="8" fill="#D64045">FAIL</text>
  <rect x="120" y="660" width="178" height="58" rx="6" fill="#FFF0F0" stroke="#D64045" stroke-width="1.5"/>
  <text x="209" y="681" text-anchor="middle" font-size="9" fill="#D64045" font-weight="700">Runtime Guard (v0.6)</text>
  <text x="209" y="697" text-anchor="middle" font-size="9" fill="#8A0000">Strip unsupported claims</text>
  <text x="209" y="711" text-anchor="middle" font-size="9" fill="#8A0000">or refuse with partial ground</text>
  <text x="209" y="716" text-anchor="middle" font-size="8" fill="#8FA8C8">evals/checks/citation-faithfulness.js</text>

  <!-- Faithful - DOWN -->
  <line x1="430" y1="732" x2="430" y2="762" stroke="#2E7D52" stroke-width="2" marker-end="url(#mg)"/>
  <text x="442" y="750" font-size="8" fill="#2E7D52" font-weight="700">PASS</text>

  <!-- Step 6: Final response -->
  <rect x="270" y="762" width="320" height="100" rx="8" fill="#E8F5EE" stroke="#2E7D52" stroke-width="2"/>
  <text x="430" y="792" text-anchor="middle" font-size="13" fill="#1A5C3A" font-weight="700">Answer Delivered to User</text>
  <text x="430" y="810" text-anchor="middle" font-size="10" fill="#2E7D52">Streamed response with cited GACAR section</text>
  <text x="430" y="826" text-anchor="middle" font-size="10" fill="#2E7D52">Retrieved source snippet (not just link)</text>
  <text x="430" y="842" text-anchor="middle" font-size="10" fill="#2E7D52">Amendment + AIRAC stamp on citation</text>
  <text x="430" y="856" text-anchor="middle" font-size="8" fill="#8FA8C8">Clickable deep-link into Library reader</text>

  <!-- Observability side note -->
  <rect x="620" y="600" width="218" height="130" rx="8" fill="#F0F5FF" stroke="#4A6FA5" stroke-width="1"/>
  <text x="729" y="622" text-anchor="middle" font-size="10" fill="#4A6FA5" font-weight="700">Observability (v0.6)</text>
  <text x="629" y="640" font-size="9" fill="#444C58">Per-turn structured metrics:</text>
  <text x="629" y="656" font-size="9" fill="#444C58">- latency, # sources retrieved</text>
  <text x="629" y="672" font-size="9" fill="#444C58">- refusal rate by category</text>
  <text x="629" y="688" font-size="9" fill="#444C58">- faithfulness score</text>
  <text x="629" y="704" font-size="9" fill="#444C58">- provider (Gemini / ALLaM)</text>
  <text x="629" y="720" font-size="8" fill="#8FA8C8">Feeds real-world eval seeding</text>
  <line x1="590" y1="688" x2="620" y2="688" stroke="#4A6FA5" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Rate limiter note -->
  <rect x="24" y="282" width="188" height="90" rx="8" fill="#F0F5FF" stroke="#4A6FA5" stroke-width="1"/>
  <text x="118" y="302" text-anchor="middle" font-size="10" fill="#4A6FA5" font-weight="700">Rate Limiter (v0.6)</text>
  <text x="34" y="320" font-size="9" fill="#444C58">Distributed (Redis / Firestore)</text>
  <text x="34" y="336" font-size="9" fill="#444C58">Replaces per-process ratelimit.js</text>
  <text x="34" y="352" font-size="9" fill="#444C58">App Check enforced</text>
  <text x="34" y="365" font-size="8" fill="#8FA8C8">Free: 5 q/day | Pro: unlimited</text>
  <line x1="212" y1="327" x2="270" y2="327" stroke="#4A6FA5" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Refusal taxonomy legend -->
  <rect x="24" y="400" width="188" height="150" rx="8" fill="#F7F0FF" stroke="#7B5EA7" stroke-width="1"/>
  <text x="118" y="420" text-anchor="middle" font-size="10" fill="#7B5EA7" font-weight="700">Refusal Taxonomy</text>
  <text x="34" y="438" font-size="9" fill="#444C58">1. Out of scope (non-GACAR)</text>
  <text x="34" y="454" font-size="9" fill="#444C58">2. Ambiguous question</text>
  <text x="34" y="470" font-size="9" fill="#444C58">3. Low retrieval confidence</text>
  <text x="34" y="486" font-size="9" fill="#444C58">4. Conflicting source passages</text>
  <text x="34" y="502" font-size="9" fill="#444C58">5. Missing / broken citation</text>
  <text x="34" y="518" font-size="9" fill="#444C58">6. Injection / role attack detected</text>
  <text x="34" y="534" font-size="8" fill="#8FA8C8">docs/refusal-taxonomy.md</text>
</svg>
