<!DOCTYPE html>
<!--
    TIDAL RECKONING — an animated generative artwork
    Built on the algorithmic-art viewer template.
    Fixed: layout, Anthropic branding, seed controls, action buttons.
    Variable: the p5.js current-field algorithm, parameters, color controls.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal Reckoning — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 80px 20px;
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers -->
            <h1>Tidal Reckoning</h1>
            <div class="subtitle">Wanderers surrender to an unseen current. Their wakes are the only record — the sea, reckoned by drift.</div>

            <!-- Seed Section (FIXED) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="7" min="1" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Wanderers</label>
                    <div class="slider-container">
                        <input type="range" id="wandererCount" min="400" max="5000" step="100" value="2000" oninput="updateParam('wandererCount', this.value)">
                        <span class="value-display" id="wandererCount-value">2000</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Current Scale</label>
                    <div class="slider-container">
                        <input type="range" id="currentScale" min="0.0010" max="0.0055" step="0.0001" value="0.0022" oninput="updateParam('currentScale', this.value)">
                        <span class="value-display" id="currentScale-value">0.0022</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0" max="1.5" step="0.05" value="0.55" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">0.55</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Drift Speed</label>
                    <div class="slider-container">
                        <input type="range" id="driftSpeed" min="0.3" max="3.0" step="0.1" value="1.1" oninput="updateParam('driftSpeed', this.value)">
                        <span class="value-display" id="driftSpeed-value">1.1</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Wake Length</label>
                    <div class="slider-container">
                        <input type="range" id="trailLength" min="6" max="70" step="1" value="32" oninput="updateParam('trailLength', this.value)">
                        <span class="value-display" id="trailLength-value">32</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Marked Vessels</label>
                    <div class="slider-container">
                        <input type="range" id="markedVessels" min="0" max="60" step="2" value="16" oninput="updateParam('markedVessels', this.value)">
                        <span class="value-display" id="markedVessels-value">16</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Field Evolution</label>
                    <div class="slider-container">
                        <input type="range" id="fieldEvolution" min="0" max="1.0" step="0.05" value="0.3" oninput="updateParam('fieldEvolution', this.value)">
                        <span class="value-display" id="fieldEvolution-value">0.3</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Deep Water</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#2a5d7d" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#2a5d7d</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Mid Current</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#46a8b6" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#46a8b6</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Phosphorescence</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#d2efe9" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#d2efe9</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (FIXED) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button secondary" onclick="regenerate()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" style="margin-top:8px;" onclick="downloadPNG()">Download PNG</button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Sounding the deep…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // TIDAL RECKONING — PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 7,
            wandererCount: 2000,    // population of obedient drifters
            currentScale: 0.0022,   // spatial scale of the prevailing current
            turbulence: 0.55,       // strength of finer shear / eddies
            driftSpeed: 1.1,        // how forcefully the water carries
            trailLength: 32,        // length of each wanderer's wake
            markedVessels: 16,      // plotted true-course vessels
            fieldEvolution: 0.3,    // how fast the sea itself reshapes
            colorPalette: ['#2a5d7d', '#46a8b6', '#d2efe9'] // deep / mid / phosphorescent
        };

        let defaultParams = {...params, colorPalette: [...params.colorPalette]};

        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE SYSTEM
        //
        // Each frame is drawn whole, from a clean sea: the gradient is repainted,
        // then every wanderer's wake is traced fresh. Nothing accumulates on the
        // canvas — the image is always an honest reckoning of the current moment.
        // ═══════════════════════════════════════════════════════════════════════

        const CW = 1200, CH = 1200;     // canvas dimensions
        const scl = 20;                 // flow-field cell size
        let cols, rows;

        let fieldAngle = [];            // deep current + turbulence (raw radians)
        let fieldDeep  = [];            // deep current only (raw radians)
        let fieldStr   = [];            // local current strength 0..1

        let particles = [];

        // the deep sea — a vertical gradient: faint surface light above, abyss below
        const SEA_TOP = { r: 16, g: 36, b: 60 };
        const SEA_BOT = { r: 6,  g: 13, b: 24 };

        // p5 color objects for the palette
        let deepCol, midCol, phosCol;

        function refreshColors() {
            deepCol = color(params.colorPalette[0]);
            midCol  = color(params.colorPalette[1]);
            phosCol = color(params.colorPalette[2]);
        }

        function drawSeaBase() {
            // opaque vertical gradient — a full, clean repaint every frame
            noStroke();
            const bands = 70;
            const bh = height / bands;
            for (let i = 0; i < bands; i++) {
                let f = i / (bands - 1);
                fill(
                    lerp(SEA_TOP.r, SEA_BOT.r, f),
                    lerp(SEA_TOP.g, SEA_BOT.g, f),
                    lerp(SEA_TOP.b, SEA_BOT.b, f)
                );
                rect(0, i * bh, width, bh + 1);
            }
        }

        function setup() {
            let canvas = createCanvas(CW, CH);
            canvas.parent('canvas-container');
            refreshColors();
            initializeSystem();
            let l = document.querySelector('.loading');
            if (l) l.style.display = 'none';
        }

        // Rebuild the entire sea from the seed.
        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            cols = floor(CW / scl) + 1;
            rows = floor(CH / scl) + 1;

            generateField(0);

            particles = [];
            let total = floor(params.wandererCount);
            let marked = floor(params.markedVessels);
            for (let i = 0; i < total; i++) {
                particles.push(new Wanderer(i < marked, true));
            }

            blendMode(BLEND);
            drawSeaBase();
        }

        // Construct the layered force field — the invisible machinery of the water.
        function generateField(zEvo) {
            let cs = params.currentScale;
            let turb = params.turbulence;
            for (let gy = 0; gy < rows; gy++) {
                for (let gx = 0; gx < cols; gx++) {
                    let x = gx * scl, y = gy * scl;
                    let idx = gx + gy * cols;

                    // deep prevailing current — long, slow, sweeping
                    let dN = noise(x * cs, y * cs, zEvo);
                    let deepAng = dN * TWO_PI * 2.0;

                    // turbulence — finer octave, shear and disagreement
                    let tN = noise(x * cs * 4.6 + 1000, y * cs * 4.6 + 1000, zEvo * 1.7 + 40);
                    let turbAng = (tN - 0.5) * PI * turb;

                    // local strength — calm pools, occasional fast lanes
                    let sN = noise(x * cs * 2.1 + 5000, y * cs * 2.1 + 5000, zEvo * 0.7 + 90);
                    let strength = 0.14 + 0.86 * Math.pow(sN, 1.7);

                    fieldDeep[idx]  = deepAng;
                    fieldAngle[idx] = deepAng + turbAng;
                    fieldStr[idx]   = strength;
                }
            }
        }

        function regenerateFieldNow() {
            generateField(frameCount * 0.0016 * params.fieldEvolution);
        }

        function draw() {
            if (particles.length === 0) return;

            // a clean sea, repainted whole — no fragile accumulation
            blendMode(BLEND);
            drawSeaBase();

            // the sea slowly reshapes itself
            if (params.fieldEvolution > 0.001 && frameCount % 3 === 0) {
                generateField(frameCount * 0.0016 * params.fieldEvolution);
            }

            // wanderers surrender to the field; their wakes glow as light on water
            blendMode(ADD);
            drawingContext.lineCap = 'round';
            drawingContext.lineJoin = 'round';
            for (let p of particles) {
                p.update();
                p.display();
            }
            blendMode(BLEND);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // WANDERER — a weightless drifter carried by unseen force,
        //            trailing the wake by which its course is reckoned
        // ═══════════════════════════════════════════════════════════════════════

        class Wanderer {
            constructor(marked, initial) {
                this.marked = marked;
                this.spawn(initial);
            }

            spawn(initial) {
                // marked vessels enter the chart from the edges; the many scatter
                if (!initial && random() < 0.4) {
                    let side = floor(random(4));
                    if (side === 0)      this.pos = createVector(random(width), 0);
                    else if (side === 1) this.pos = createVector(width, random(height));
                    else if (side === 2) this.pos = createVector(random(width), height);
                    else                 this.pos = createVector(0, random(height));
                } else {
                    this.pos = createVector(random(width), random(height));
                }
                this.vel = createVector(0, 0);
                this.trail = [this.pos.x, this.pos.y];
                this.age = 0;
                this.maxLife = this.marked
                    ? floor(random(700, 1500))
                    : floor(random(150, 520));
            }

            sampleIndex() {
                let gx = constrain(floor(this.pos.x / scl), 0, cols - 1);
                let gy = constrain(floor(this.pos.y / scl), 0, rows - 1);
                return gx + gy * cols;
            }

            update() {
                let idx = this.sampleIndex();

                // marked vessels hold a faithful course — they trust the deep set
                // and yield only slightly to turbulence
                let ang = this.marked
                    ? fieldDeep[idx] + 0.25 * (fieldAngle[idx] - fieldDeep[idx])
                    : fieldAngle[idx];

                let strength = fieldStr[idx];
                let forceMag = strength * params.driftSpeed * 0.30;
                if (this.marked) forceMag *= 1.15;

                let acc = p5.Vector.fromAngle(ang).setMag(forceMag);
                this.vel.add(acc);
                this.vel.mult(0.90);
                this.vel.limit(params.driftSpeed * 4);

                this.pos.add(this.vel);
                this.age++;

                // record the wake
                this.trail.push(this.pos.x, this.pos.y);
                let maxPts = (this.marked ? params.trailLength * 2 : params.trailLength);
                let excess = this.trail.length - maxPts * 2;
                if (excess > 0) this.trail.splice(0, excess);

                let off = this.pos.x < -14 || this.pos.x > width + 14 ||
                          this.pos.y < -14 || this.pos.y > height + 14;
                if (this.age > this.maxLife || off) this.spawn(false);
            }

            drawTier(startIdx, r, g, b, a, w) {
                if (a < 1) return;
                let tr = this.trail;
                if (tr.length - startIdx < 4) return;
                // raw canvas paths — far faster than p5 beginShape/vertex
                let ctx = drawingContext;
                ctx.lineWidth = w;
                ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (a / 255).toFixed(3) + ')';
                ctx.beginPath();
                ctx.moveTo(tr[startIdx], tr[startIdx + 1]);
                for (let i = startIdx + 2; i < tr.length; i += 2) {
                    ctx.lineTo(tr[i], tr[i + 1]);
                }
                ctx.stroke();
            }

            display() {
                let n = this.trail.length / 2;
                if (n < 2) return;

                // soft birth and death so nothing flickers into being
                let lifeFade = Math.min(
                    constrain(this.age / 14, 0, 1),
                    constrain((this.maxLife - this.age) / 40, 0, 1)
                );
                if (lifeFade <= 0) return;

                let speed = this.vel.mag();
                let t = constrain(speed / (params.driftSpeed * 3.2), 0, 1);

                let c, baseA, w;
                if (this.marked) {
                    // a plotted true course — luminous, deliberate, clean across the deep
                    let tt = constrain(t + 0.35, 0, 1);
                    c = lerpColor(midCol, phosCol, tt);
                    baseA = (140 + 85 * tt) * lifeFade;
                    w = 1.9 + t * 1.0;
                } else {
                    // velocity made legible: slow water sinks dark, fast water burns pale
                    c = (t < 0.5)
                        ? lerpColor(deepCol, midCol, t * 2)
                        : lerpColor(midCol, phosCol, (t - 0.5) * 2);
                    baseA = (70 + 105 * t) * lifeFade;
                    w = 1.05 + t * 1.5;
                }

                let cr = red(c) | 0, cg = green(c) | 0, cb = blue(c) | 0;

                // two overlapping passes: a faint full wake and a luminous head —
                // the comet-tail of a drifting vessel
                this.drawTier(0,                       cr, cg, cb, baseA * 0.42, w);
                this.drawTier(Math.floor(n * 0.55) * 2, cr, cg, cb, baseA * 1.00, w * 1.08);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(name, value) {
            let num = parseFloat(value);
            params[name] = num;

            let disp = document.getElementById(name + '-value');
            if (disp) disp.textContent = value;

            if (name === 'wandererCount' || name === 'markedVessels') {
                initializeSystem();
            } else if (name === 'currentScale' || name === 'turbulence') {
                regenerateFieldNow();
            }
            // driftSpeed, trailLength, fieldEvolution update live
        }

        function updateColor(colorId, value) {
            let index = { color1: 0, color2: 1, color3: 2 }[colorId];
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
            refreshColors();
        }

        function regenerate() {
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('tidal-reckoning-' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS (FIXED)
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams, colorPalette: [...defaultParams.colorPalette]};

            let sliders = ['wandererCount', 'currentScale', 'turbulence',
                           'driftSpeed', 'trailLength', 'markedVessels', 'fieldEvolution'];
            for (let s of sliders) {
                document.getElementById(s).value = params[s];
                document.getElementById(s + '-value').textContent = params[s];
            }

            let cids = ['color1', 'color2', 'color3'];
            for (let i = 0; i < 3; i++) {
                document.getElementById(cids[i]).value = params.colorPalette[i];
                document.getElementById(cids[i] + '-value').textContent = params.colorPalette[i];
            }

            refreshColors();
            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
