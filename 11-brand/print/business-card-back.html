<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business card back</title>
<link rel="stylesheet" href="brand-print.css">
<style>
@page { size: 85mm 55mm; margin: 0; }

.cardb { width:85mm; height:55mm; background:var(--falcon-night); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
.cardb .en-name { color:var(--teal-bright); font-family:'Inter',sans-serif; font-size:8pt; letter-spacing:1px; }
.cardb .ar-name { color:var(--ivory); font-size:12pt; font-weight:800; }
.cardb .tag { color:#7A8590; font-size:7pt; font-family:'Inter',sans-serif; }

</style>
</head>
<body>
<div class="cardb"><svg class="mark mark-lg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="Fly GACA falcon mark">
  <defs>
    <linearGradient id="bc2-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4A9CB8"/><stop offset="100%" stop-color="#2D6E8A"/></linearGradient>
    <linearGradient id="bc2-g" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#B5DDC2"/><stop offset="100%" stop-color="#8FC9A8"/></linearGradient>
  </defs>
  <path d="M14,28 C20,16 32,11 44,16 C50,18 52,22 50,28 C46,30 40,29 35,32 C30,34 24,33 14,28 Z" fill="url(#bc2-b)"/>
  <path d="M16,38 C26,34 36,36 46,32 C50,38 50,46 44,50 C36,52 26,50 18,46 C14,43 13,40 16,38 Z" fill="url(#bc2-g)"/>
</svg>
  <div class="ar-name">شركة بدع الدولية</div>
  <div class="en-name en">BDA COMPANY INTERNATIONAL</div>
  <div class="tag en">Independent · Not affiliated with GACA</div>
</div>
</body>
</html>
