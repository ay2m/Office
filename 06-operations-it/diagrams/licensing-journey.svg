  <text x="250" y="1016" text-anchor="middle" font-size="10" fill="#2E7D52">Class 2 Medical - renew 24 mo.</text>
  <text x="250" y="1034" text-anchor="middle" font-size="9" fill="#2E7D52">Next: hour-building toward CPL/IR</text>
  <text x="402" y="993" text-anchor="middle" font-size="12" fill="#B8800A" font-weight="700">OR</text>
