  <text x="586" y="670" text-anchor="middle" font-size="9" fill="#444C58">incl. 10 hrs solo PIC</text>
  <text x="586" y="684" text-anchor="middle" font-size="8" fill="#8FA8C8">GACAR 61 Subpart E</text>
