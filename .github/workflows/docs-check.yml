name: docs-check

# Guards the office docs: every content .md carries the standard YAML
# front-matter, every doc has an up-to-date PDF under _print/, and every
# brand HTML has a rendered PDF. Dependency-free and browser-free — just
# runs tools/print/check.mjs on Node.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.html'
      - '_print/**'
      - 'tools/print/**'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      - name: Validate front-matter and _print PDF coverage
        run: node tools/print/check.mjs
